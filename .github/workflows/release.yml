name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Refresh any existing (draft) release for this tag, so re-pushing a
          # tag re-runs cleanly instead of failing on "release already exists".
          # --cleanup-tag is omitted so the git tag itself is kept.
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
